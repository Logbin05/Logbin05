name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Logbin05
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Tallinn
          filename: github-metrics.svg
