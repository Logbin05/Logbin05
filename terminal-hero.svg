<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DDC97" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0E11" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="900" height="340" rx="12"/></clipPath>

    <!-- маски для эффекта печати -->
    <clipPath id="typeCmd1"><rect x="34" y="60" height="30" width="0">
      <animate attributeName="width" from="0" to="200" begin="0.4s" dur="0.7s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="typeCmd2"><rect x="34" y="278" height="30" width="0">
      <animate attributeName="width" from="0" to="360" begin="5.2s" dur="1s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <style>
    .fade   { opacity: 0; animation: fadein .45s ease-out forwards; }
    .d1 { animation-delay: 1.5s } .d2 { animation-delay: 2.0s }
    .d3 { animation-delay: 2.7s } .d4 { animation-delay: 3.3s } .d5 { animation-delay: 3.9s }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

    .blink  { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    .scan   { animation: sweep 7s linear infinite; }
    @keyframes sweep { 0% { transform: translateY(-40px); opacity: 0 }
                       12% { opacity: .5 }
                       88% { opacity: .5 }
                       100% { transform: translateY(360px); opacity: 0 } }

    .pulse  { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .14 } 50% { opacity: .26 } }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="340" fill="#0B0E11"/>
    <circle class="pulse" cx="820" cy="40" r="220" fill="url(#glow)"/>

    <!-- бегущая полоса развёртки -->
    <rect class="scan" x="0" y="38" width="900" height="26" fill="#3DDC97" opacity="0.05"/>

    <!-- заголовок окна -->
    <rect width="900" height="38" fill="#12161B"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#1E252D" stroke-width="1"/>
    <circle cx="24" cy="19" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="19" r="6" fill="#FEBC2E"/>
    <circle cx="68" cy="19" r="6" fill="#3DDC97"/>
    <text x="450" y="24" fill="#5C6773" font-size="13" text-anchor="middle">alexey@tisbi: ~/dev</text>

    <!-- команда 1: печатается -->
    <g clip-path="url(#typeCmd1)">
      <text x="34" y="82" font-size="15">
        <tspan fill="#3DDC97">alexey@tisbi</tspan><tspan fill="#5C6773">:~/dev$ </tspan><tspan fill="#D5DAE0">whoami</tspan>
      </text>
    </g>

    <!-- вывод: появляется построчно -->
    <text class="fade d1" x="34" y="132" fill="#D5DAE0" font-size="34" font-weight="700">Alexey</text>
    <text class="fade d2" x="34" y="162" fill="#3DDC97" font-size="17">Systems &amp; Backend Engineer · Rust</text>

    <text class="fade d3" x="34" y="205" font-size="14">
      <tspan fill="#5C6773">&gt; </tspan><tspan fill="#D5DAE0">senior backend developer · sysadmin &amp; instructor @ TISBI College</tspan>
    </text>
    <text class="fade d4" x="34" y="230" font-size="14">
      <tspan fill="#5C6773">&gt; </tspan><tspan fill="#D5DAE0">4 years freelance · writing code since 15</tspan>
    </text>
    <text class="fade d5" x="34" y="255" font-size="14">
      <tspan fill="#5C6773">&gt; </tspan><tspan fill="#D5DAE0">async runtimes · P2P networking · applied cryptography</tspan>
    </text>

    <!-- команда 2: печатается позже -->
    <g clip-path="url(#typeCmd2)">
      <text x="34" y="300" font-size="15">
        <tspan fill="#3DDC97">alexey@tisbi</tspan><tspan fill="#5C6773">:~/dev$ </tspan><tspan fill="#D5DAE0">cargo run --release</tspan>
      </text>
    </g>
    <!-- мигающий курсор -->
    <rect class="blink" x="398" y="288" width="9" height="16" fill="#3DDC97"/>

    <rect x="0" y="0" width="900" height="340" rx="12" fill="none" stroke="#1E252D" stroke-width="2"/>
  </g>
</svg>
